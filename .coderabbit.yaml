# CodeRabbit config — the deterministic (non-LLM) analyzers for PR review. The
# local `coderabbit` CLI is LLM-driven; this file enables the model-free suite.
reviews:
  profile: chill
  tools:
    oxlint:
      enabled: true
    gitleaks:
      enabled: true
    osvScanner:
      enabled: true
    semgrep:
      enabled: true
    shellcheck:
      enabled: true
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
