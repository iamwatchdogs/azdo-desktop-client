# Gitleaks configuration.
#
# Default rules plus one narrow exception: test files embed literal secret
# markers as fixtures. Without it `policy.test.ts` (which asserts the
# private-key detector fires) is itself a leak, and a guardrail that cries wolf
# on its own suite is one people bypass.

title = "azure-devops-app gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures embed literal secret markers by design"
paths = [
  '''(^|/)[^/]*\.(test|spec)\.[cm]?[jt]sx?$''',
  '''(^|/)__tests__/''',
  '''(^|/)tests?/fixtures?/''',
]

[[allowlists]]
description = "Lockfiles carry hashes that trip entropy-based rules"
paths = ['''(^|/)(pnpm-lock\.yaml|package-lock\.json|yarn\.lock)$''']
