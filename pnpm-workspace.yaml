packages:
  - apps/*
  - packages/*

# pnpm 11+ successor to onlyBuiltDependencies. true = the package's install
# script may run; false = pnpm 10 behaviour (skipped).
allowBuilds:
  "@crowecawcaw/xa11y": true
  "@napi-rs/keyring": true
  electron: true
  electron-winstaller: true
  esbuild: true
  ffi-rs: true

permissions:
  # @tanstack/router-plugin ships agent skills (skills/*/SKILL.md); denied so
  # they stay out of this repo and resolution never waits on approval.
  "@tanstack/router-plugin":
    build: false
    skills: false

# Disables pnpm 12's 24h freshness gate so pinned versions install
# deterministically. t3code keeps the gate and maintains an exclusion list.
minimumReleaseAge: 0

overrides:
  # One copy of the toolchain and React across every workspace.
  react: "catalog:"
  react-dom: "catalog:"
  vite: "catalog:"
  vite-plus: "catalog:"
  # dbus-next's optional unix-socket fast path needs a native build and is
  # unused on macOS; cut the edge like t3code does.
  "dbus-next>usocket": "-"

# `vite` is aliased to @voidzero-dev/vite-plus-core (Vite 8 + Rolldown), which
# does not satisfy vitest's `vite` peer range.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Single source of truth for shared dependency versions (pnpm catalog protocol).
