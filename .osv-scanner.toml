# OSV scanner policy — accepted advisories for the dependency gate.
#
# `osv-scanner` exits non-zero on *any* known advisory, at any severity, in any
# part of the dependency tree — including packages that never ship and never
# see untrusted input. Left alone, a transitive advisory nobody can act on
# blocks every push on every branch.
#
# Each entry below is a deliberate, reviewed acceptance. Remove an entry the
# moment a fix is reachable; the gate re-fails on the next push if it is still
# present and the fix has not landed. Re-review this file quarterly.
#
# Scoped on purpose: this suppresses three specific advisories, not a class.
# Anything new still fails the gate.

[[IgnoredVulns]]
id = "GHSA-rj75-hqrm-r3gf"
reason = """
postcss-selector-parser: quadratic complexity in flat selector parsing, which
can be driven into CPU exhaustion.

Transitive via @tailwindcss/typography (a devDependency of @ado/renderer), so
it is build-time CSS tooling only: it never ships in the packaged app and never
parses attacker-controlled input. The fix is 7.1.6, but typography@0.5.20 —
itself the latest release — pins 6.0.10 and has no 7.x-compatible release.
Remove this entry once typography bumps its floor.
"""

[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"
reason = """
sprintf-js: unbounded precision handling allows a denial of service.

Transitive via roarr -> global-agent -> @electron/get -> app-builder-lib ->
electron-builder (a devDependency of @ado/desktop), i.e. packaging tooling that
runs at build time and never in the shipped app. No fixed version exists in any
sprintf-js release; 1.1.3 is the newest. This entry is not actionable upstream
and should be removed only in favour of the package leaving the tree.
"""

[[IgnoredVulns]]
id = "GHSA-776f-qx25-q3cc"
reason = """
xml2js: prototype pollution when parsing crafted XML.

Transitive via dbus-next@0.10.2, the Linux D-Bus binding used by
@ado/desktop. The XML it parses is our own D-Bus message traffic on the local
session bus, not attacker-supplied documents, and the binding is not reachable
on other platforms. The fix is 0.5.0, but dbus-next@0.10.2 — the latest
release — pins the 0.4.x line. Remove this entry once dbus-next bumps.
"""
