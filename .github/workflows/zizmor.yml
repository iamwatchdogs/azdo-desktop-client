name: GitHub Actions Security Analysis with zizmor

# Static analysis of the workflows themselves: template injection through
# untrusted `${{ }}`, injection via action pins, excessive token scope,
# artipacked checkout refs. Every `uses:` is already SHA-pinned with job-level
# `permissions`; zizmor keeps that true as workflows are added.

on:
  push:
    branches: [main]
    paths:
      - ".github/**"
  pull_request:
    paths:
      - ".github/**"

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read
      actions: read # read workflow metadata for the SARIF upload

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
