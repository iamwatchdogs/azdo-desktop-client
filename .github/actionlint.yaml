# actionlint configuration.
#
# ## Why
#
# ci.yml wraps five static-analysis steps in a `parallel:` block. That is
# intentional: GitHub shipped parallel steps on 2026-06-25 and those checks are
# independent and read-only.
#
# actionlint v1.7.12 -- the newest release, and what lint-workflows pins --
# cannot parse `parallel`. Every block yields one error:
#
#   step must run script with "run" section or run action with "uses" section
#
# which fails the job, and through it `CI Status`, on every PR and release.
#
# ## What the suppression costs
#
# Because actionlint does not understand the structure, it does not see steps
# *inside* a `parallel:` block as steps: they are neither shellchecked nor
# context-checked. Verified, not assumed -- the same `run: echo $FOO` is
# reported as SC2086 under `jobs.<id>.steps` and as nothing one level down
# inside `parallel:`.
#
# So the blind spot is bounded to steps nested in `parallel:` blocks.
# Everything else is still fully checked -- confirmed by keeping a deliberate
# SC2086 outside a parallel block and seeing it still fail. GitHub's own parser
# independently rejects a malformed step, so the residual risk is a lint gap,
# not a broken pipeline.
#
# ## Removing this
#
# Delete the file once actionlint parses `parallel:`. No upstream release does
# yet, so it cannot be dated; it goes away when `raven-actions/actionlint` with
# a supporting `version:` lands. Until then the alternative is dropping
# `parallel:` from ci.yml and accepting sequential steps.

paths:
  # Not scoped to ci.yml: the limitation is a property of actionlint, not of
  # one file, and scoping would make the next `parallel:` block a fresh,
  # unexplained failure.
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      - 'step must run script with "run" section or run action with "uses" section'
