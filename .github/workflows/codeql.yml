name: "CodeQL Advanced"

# Two languages, both build-mode: none.
#
# Do not add a build step -- not `pnpm build`, not `tsc`, not `autobuild`.
# Compiling does not help the scan, it breaks it: a `--command` overrides
# CodeQL's own JS/TS extractor and yields an empty database and a green run that
# found nothing. GitHub says so explicitly -- "you should not specify a
# `--command` option ... which will create an empty database". `--build-mode`
# is likewise documented for C/C++, C#, Java and Rust only, not interpreted
# languages.
#
# Nothing is gained either: CodeQL's TypeScript support does its own
# source-local inference and never reads tsc's type graph. Generated files are
# handled by exclusion below instead.
#
# GitHub Actions is the other language: a template injection or an unpinned
# `uses:` would live in the workflow definitions. `build-mode` is a per-job
# input, which is why each language gets its own matrix row.
#
# `security-and-quality` over the default `security`: it adds the
# maintainability queries, and triaging those costs the same as a real alert.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

concurrency:
  # A scheduled run must not be cancelled by a push landing mid-analysis.
  group: codeql-${{ github.ref }}${{ github.event_name == 'schedule' && '-scheduled' || '' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read # fetch private or internal CodeQL packs
      actions: read # private repos: read workflow metadata for SARIF
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          # routeTree.gen.ts is written by @tanstack/router-plugin, committed, and
          # already excluded from oxfmt (vite.config.ts fmt.ignorePatterns),
          # knip and language stats (.gitattributes). Scanning it contradicts the
          # rest of the toolchain: it is a flat list of imports and route
          # literals no security query has anything to say about. Its
          # `@ts-nocheck` header does not help -- CodeQL parses, not type-checks.
          config: |
            paths-ignore:
              - "**/routeTree.gen.ts"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
